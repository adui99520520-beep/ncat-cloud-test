name: Direct Android session (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  android-session:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up disposable Android
        run: |
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"; then
            sudo apt-get update -qq
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y adb
          docker run -d --rm --privileged --name ncat-direct -p 127.0.0.1:5555:5555 redroid/redroid@sha256:52332b2d74f337982d5ac281a8020ec297fb1ea05cbdcdaaa9c19a2065ae1adc androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest
          for n in $(seq 1 90); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s 127.0.0.1:5555 shell setprop persist.sys.timezone Asia/Kuala_Lumpur
          curl -fL --retry 2 --max-time 120 -sS -o /tmp/ncat.apk 'https://dl.ncat33.com/target/apk/ncat/202611/26/app/c200000-NcatC200000V261126030029-3.5.1.30501_release.apk'
          echo '1de44b3d42f60120d46e621968239c869995c659f2baf6bfb83b3d60539b28a3  /tmp/ncat.apk' | sha256sum -c -
          adb -s 127.0.0.1:5555 install /tmp/ncat.apk
      - name: Start private direct UI session
        env:
          NCAT_USERNAME: ${{ secrets.NCAT_USERNAME }}
          NCAT_PASSWORD: ${{ secrets.NCAT_PASSWORD }}
          RELAY_URL: https://18136-in7o84jguiogr6pssr8hu-18b18001.sg3.manus.computer
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          try:
              token_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=cue-ncat-direct-session-20261129'
              token_req = urllib.request.Request(token_url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(token_req, timeout=20) as response:
                  id_token = json.load(response)['value']
              base = os.environ['RELAY_URL'].rstrip('/')
              bootstrap = urllib.request.Request(base + '/bootstrap', data=json.dumps({'id_token': id_token}).encode(), headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(bootstrap, timeout=20) as response:
                  relay_token = json.load(response)['token']
              worker_req = urllib.request.Request(base + '/worker', headers={'Authorization': 'Bearer ' + relay_token})
              with urllib.request.urlopen(worker_req, timeout=20) as response:
                  worker = response.read()
              os.environ['RELAY_TOKEN'] = relay_token
              exec(compile(worker, 'private-direct-worker', 'exec'), {'__name__': '__main__'})
          except Exception as exc:
              print('DIRECT_SESSION_ERROR=' + type(exc).__name__, flush=True)
              sys.exit(1)
          PY
      - name: Delete disposable Android container
        if: always()
        run: docker rm -f ncat-direct >/dev/null 2>&1 || true
