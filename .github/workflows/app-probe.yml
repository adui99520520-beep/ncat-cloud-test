name: Android app compatibility probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot clean Android, install and launch app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            set -eu
            curl -fL --retry 2 --max-time 120 -sS -o /tmp/ncat.apk 'https://dl.ncat33.com/target/apk/ncat/202611/26/app/c200000-NcatC200000V261126030029-3.5.1.30501_release.apk'
            echo '1de44b3d42f60120d46e621968239c869995c659f2baf6bfb83b3d60539b28a3  /tmp/ncat.apk' | sha256sum -c -
            AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
            PKG="$("$AAPT" dump badging /tmp/ncat.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            test -n "$PKG"
            echo "Package: $PKG"
            adb install /tmp/ncat.apk
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 30
            if adb shell pidof "$PKG" | grep -q '[0-9]'; then echo 'APP_PROCESS=RUNNING'; else echo 'APP_PROCESS=NOT_RUNNING'; exit 1; fi
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/window.xml > /tmp/ui.xml 2>/dev/null || true
            for word in 今日签到 签到 我的 登录; do
              if grep -q "$word" /tmp/ui.xml; then echo "UI_PRESENT=$word"; else echo "UI_ABSENT=$word"; fi
            done
