name: Android cloud compatibility probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm-runner-capabilities:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Inspect ARM runner acceleration
        run: |
          uname -a
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo 'No /dev/kvm on ARM runner'; fi
  x86-emulator-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM permissions
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android and inspect supported ABIs
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb shell getprop sys.boot_completed
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getprop ro.build.version.release
