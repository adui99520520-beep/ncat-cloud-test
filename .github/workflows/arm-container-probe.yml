name: ARM Android container probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm-android:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check Android binder kernel support
        run: |
          uname -a
          grep binder /proc/filesystems || true
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"; then
            sudo apt-get update -qq
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          fi
      - name: Run disposable ARM Android container
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y adb
          docker run -d --rm --privileged --name ncat-android-probe -p 127.0.0.1:5555:5555 redroid/redroid:12.0.0-latest androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest
          adb connect 127.0.0.1:5555 || true
          for n in $(seq 1 90); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist
          curl -fL --retry 2 --max-time 120 -sS -o /tmp/ncat.apk 'https://dl.ncat33.com/target/apk/ncat/202611/26/app/c200000-NcatC200000V261126030029-3.5.1.30501_release.apk'
          echo '1de44b3d42f60120d46e621968239c869995c659f2baf6bfb83b3d60539b28a3  /tmp/ncat.apk' | sha256sum -c -
          adb -s 127.0.0.1:5555 install /tmp/ncat.apk
          adb -s 127.0.0.1:5555 logcat -c
          adb -s 127.0.0.1:5555 shell am start -n com.ncatC200000V261126.T030029/com.salmon.film.main.ui.SplashActivity
          sleep 30
          if adb -s 127.0.0.1:5555 shell pidof com.ncatC200000V261126.T030029 | grep -q '[0-9]'; then
            echo APP_PROCESS=RUNNING
            adb -s 127.0.0.1:5555 shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tail -2 || true
            adb -s 127.0.0.1:5555 shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb -s 127.0.0.1:5555 shell cat /sdcard/window.xml >/tmp/ui.xml 2>/dev/null || true
            echo '=== UI node attributes (text, ids, clickability, bounds) ==='
            grep -oE '(text|content-desc|resource-id|clickable|bounds)="[^"]*"' /tmp/ui.xml | head -n 180 || true
            for word in 今日签到 签到 我的 登录; do
              if grep -q "$word" /tmp/ui.xml; then echo "UI_PRESENT=$word"; else echo "UI_ABSENT=$word"; fi
            done
          else
            echo APP_PROCESS=NOT_RUNNING
            adb -s 127.0.0.1:5555 logcat -d -b crash | grep -E 'FATAL EXCEPTION|Process:|java.lang.|UnsatisfiedLinkError|Fatal signal|Caused by:' | head -25 || true
            exit 1
          fi
